<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">Gyebran GitHub metrics</title>
  <desc id="desc">Self-hosted Emerald Matrix GitHub metrics panel. Values are refreshed automatically by GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120c"/><stop offset="1" stop-color="#091a12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="228" rx="18" fill="url(#bg)" stroke="#174c34" stroke-width="2"/>
  <text x="36" y="44" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700">GITHUB://LIVE_TELEMETRY</text>
  <text x="36" y="78" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">syncing live metrics from GitHub API...</text>
  <rect x="36" y="105" width="928" height="1" fill="#174c34"/>
  <text x="36" y="156" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="28" font-weight="700">INITIALIZING</text>
  <text x="36" y="190" fill="#7ee787" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">This panel will update automatically after the next profile workflow run.</text>
</svg>