<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Gyebran current process matrix console</title>
  <desc id="desc">Emerald terminal-style panel showing current building, learning, exploring, and goal focus.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120c"/>
      <stop offset="1" stop-color="#091a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f2d1f" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#panel)" stroke="#174c34" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#grid)"/>
  <circle cx="36" cy="34" r="6" fill="#174c34"/><circle cx="58" cy="34" r="6" fill="#14532d"/><circle cx="80" cy="34" r="6" fill="#22c55e"/>
  <text x="108" y="40" fill="#86efac" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700">GYEBRAN://CURRENT_PROCESS</text>
  <text x="875" y="40" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">● ONLINE</text>
  <rect x="30" y="62" width="940" height="2" fill="url(#accent)" opacity="0.75"/>

  <text x="48" y="105" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">01</text>
  <text x="92" y="105" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">BUILDING</text>
  <text x="220" y="105" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">full-stack &amp; AI-integrated applications</text>

  <text x="48" y="148" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">02</text>
  <text x="92" y="148" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">LEARNING</text>
  <text x="220" y="148" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">deeper system design, architecture &amp; automation</text>

  <text x="48" y="191" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">03</text>
  <text x="92" y="191" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">EXPLORING</text>
  <text x="220" y="191" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">practical ways to connect technology with real workflows</text>

  <text x="48" y="234" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">04</text>
  <text x="92" y="234" fill="#00ff9c" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700">GOAL</text>
  <text x="220" y="234" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">become a better builder with every project</text>

  <rect x="48" y="260" width="160" height="3" rx="2" fill="#00ff9c" filter="url(#glow)"/>
  <text x="224" y="266" fill="#5c8374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">BUILD · LEARN · IMPROVE · REPEAT</text>
</svg>